<g data-kind="llm"><rect x="315" y="505" width="225" height="80" rx="9" fill="#f1ebf8" stroke="#ac95c0"/><text class="kind" x="427.5" y="526">AI 모델</text><text class="title" x="427.5" y="551">추천 조건 정리</text><text class="preview" x="427.5" y="573">알레르기·선호 추출</text><text class="sub">입력: 고객의 현재 답변 + 기존 추천 조건</text><text class="sub">처리: 알레르기와 맛·메뉴 선호를 구조화하고, 고객이 바꾼 조건은 기존 상태에 반영합니다.</text><text class="sub">결과: 필터링에 사용할 추천 조건</text><text class="sub">예시: “우유는 못 먹고 상큼한 게 좋아요” → 우유 알레르기와 상큼한 선호</text><text class="sub">함수 · 현재 서버: generate_recommendation_conditions()</text><text class="sub">지침 파일: prompts/recommendation_conditions.md</text></g>
