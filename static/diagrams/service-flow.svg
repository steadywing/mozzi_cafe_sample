<g data-kind="human"><rect x="315" y="241" width="225" height="80" rx="9" fill="#fff0ef" stroke="#d48a86"/><text class="kind" x="427.5" y="262">질문</text><text class="title" x="427.5" y="287">의도 확인</text><text class="preview" x="427.5" y="309">불분명한 요청을 확인합니다.</text><text class="sub">입력: 이번 입력 + 분류 결과 unknown</text><text class="sub">처리: 이전 의도를 참고해도 요청이 모호하거나 여러 목적 중 순서를 알 수 없으면 필요한 내용을 묻습니다.</text><text class="sub">결과: 고객에게 보낼 확인 질문</text><text class="sub">예시: “메뉴 추천과 주차 안내 중 무엇부터 도와드릴까요?”</text><text class="sub">함수 · 현재 서버: generate_unknown_response()</text><text class="sub">지침 파일: prompts/persona.md + prompts/unknown_response.md</text></g>
<g data-kind="result"><rect x="600" y="241" width="225" height="80" rx="9" fill="#f1f1f1" stroke="#b7b3bc"/><text class="kind" x="712.5" y="262">응답</text><text class="title" x="712.5" y="287">다음 입력 대기</text><text class="preview" x="712.5" y="309">고객의 답변을 기다립니다.</text><text class="sub">입력: 의도 확인 질문</text><text class="sub">처리: 질문을 고객에게 전달하고 다음 대화에 필요한 상태를 저장합니다.</text><text class="sub">결과: 이번 턴 종료 및 고객 답변 대기</text><text class="sub">다음 턴: 고객 답변을 받으면 그 입력으로 의도 분류부터 다시 진행합니다.</text><text class="sub">함수 · 현재 서버: save_state()</text></g>
