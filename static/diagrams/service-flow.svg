<g data-kind="llm"><rect x="315" y="373" width="225" height="80" rx="9" fill="#f1ebf8" stroke="#ac95c0"/><text class="kind" x="427.5" y="394">AI 모델</text><text class="title" x="427.5" y="419">주문 구조화</text><text class="preview" x="427.5" y="441">메뉴·수량·옵션 추출</text><text class="sub">입력: 고객의 주문 문장 + 진행 중인 주문 초안</text><text class="sub">처리: 상품명, 수량, 온도, 옵션, 이용 방식과 결제 방식 등 고객이 말한 내용을 주문 초안에 정리합니다.</text><text class="sub">결과: 메뉴 확인에 넘길 주문 초안</text><text class="sub">예시: “아이스 아메리카노 두 잔” → 상품명·온도·수량</text><text class="sub">함수 · 현재 서버: create_order_draft()</text><text class="sub">지침 파일: prompts/persona.md + prompts/order_extraction.md</text></g>
