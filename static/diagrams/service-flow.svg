<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1110" viewBox="0 0 1900 1110" role="img" aria-labelledby="title description">
<title id="title">모찌카페 챗봇 현재 FastAPI 실습 흐름</title>
<desc id="description">의도 분류 API는 매 턴 상태를 준비하고 Jev로 분류하며 unknown일 때만 확인 답변을 만듭니다. 주문, 추천, 검색, 정보문의, 포인트 적립은 각각 별도의 실습 API에서 실행합니다. 노드를 선택하면 상세 설명을 볼 수 있습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7754a3"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#302b39}.heading{font-size:27px;font-weight:700}.caption{font-size:17px;fill:#6b6275}.row-title{font-size:20px;font-weight:700}.row-number{font-size:14px;font-weight:700;fill:#8b79a2}.route{font-size:14px;fill:#6b6275}.kind{font-size:14px;font-weight:700;fill:#766588;text-anchor:middle}.title{font-size:19px;font-weight:700;text-anchor:middle}.preview{font-size:14px;fill:#686271;text-anchor:middle}.edge{fill:none;stroke:#7754a3;stroke-width:2;marker-end:url(#arrow)}.next-request{stroke-dasharray:7 6}.spine{fill:none;stroke:#7754a3;stroke-width:2}.sub{display:none}</style>
<rect width="1900" height="1110" fill="#faf9fc"/>
<text class="heading" x="55" y="48">모찌카페 현재 실습 흐름</text><text class="caption" x="55" y="77">현재 FastAPI 코드 · 위쪽 분류 API와 아래 기능별 API는 별도로 실행합니다.</text>
<g data-kind="result"><rect x="310" y="100" width="220" height="80" rx="9" fill="#f1f1f1" stroke="#b7b3bc"/><text class="kind" x="420.0" y="121">입력</text><text class="title" x="420.0" y="146">고객 요청</text><text class="preview" x="420.0" y="168">텍스트 · 첨부 여부</text><text class="sub">입력: CustomerRequest의 세션 ID, 고객 정보, 텍스트, has_image 값</text><text class="sub">처리: POST /chatbot/intent/turn에서 이번 요청을 받습니다. 이미지 원본은 받지 않습니다.</text><text class="sub">결과: 상태 준비에 전달할 고객 요청</text><text class="sub">예시: “아이스 아메리카노 두 잔 주세요”</text></g>
<g data-kind="tool"><rect x="610" y="100" width="250" height="80" rx="9" fill="#e4effb" stroke="#7299c2"/><text class="kind" x="735.0" y="121">Python</text><text class="title" x="735.0" y="146">상태 준비</text><text class="preview" x="735.0" y="168">세션별 이전 상태 복원</text><text class="sub">입력: CustomerRequest와 세션 ID</text><text class="sub">처리: 메모리에 마지막 상태가 있으면 복원하고, 없으면 새 상태를 만듭니다. 이전 의도를 보관하고 이번 입력과 고객 메시지를 기록합니다.</text><text class="sub">결과: 이번 입력과 이전 의도를 담은 SessionState</text><text class="sub">참고: 고객 정보가 새로 전달되지 않으면 기존 정보를 유지합니다.</text><text class="sub">함수 · 현재 서버: prepare_state()</text></g>
<g data-kind="llm"><rect x="940" y="100" width="290" height="80" rx="9" fill="#f1ebf8" stroke="#ac95c0"/><text class="kind" x="1085.0" y="121">Jev</text><text class="title" x="1085.0" y="146">매 턴 의도 분류</text><text class="preview" x="1085.0" y="168">현재 입력 + 이전 의도</text><text class="sub">입력: 이번 텍스트 + previous_intent + 이미지 첨부 여부</text><text class="sub">처리: Jev가 현재 입력을 우선하고 후속 답변일 때 이전 의도를 참고해 매 턴 분류합니다.</text><text class="sub">결과: 선택한 의도와 신뢰도</text><text class="sub">예시: 주문 중 “네, 맞아요”는 주문 후속 답변, “근의 공식 알려줘”는 unknown입니다.</text><text class="sub">참고: 분류에는 대화 기록과 이미지 원본을 보내지 않습니다.</text><text class="sub">함수 · 현재 서버: classify_intent()</text><text class="sub">지침 파일: prompts/intent_router.md</text></g>
<g data-kind="result"><rect x="1310" y="100" width="290" height="80" rx="9" fill="#f1f1f1" stroke="#b7b3bc"/><text class="kind" x="1455" y="121">분류 결과</text><text class="title" x="1455" y="146">그 외 의도 저장</text><text class="preview" x="1455" y="168">기능 자동 호출 없음</text><text class="sub">입력: unknown 이외의 의도와 신뢰도</text><text class="sub">처리: save_state()가 상태를 서버 메모리에 저장하고 분류 결과를 돌려줍니다.</text><text class="sub">결과: 선택된 의도와 상태. 주문·추천·검색·문의·포인트 API는 자동 실행하지 않습니다.</text><text class="sub">함수 · 현재 서버: save_state()</text></g>
