<g data-kind="tool"><rect x="885" y="505" width="225" height="80" rx="9" fill="#e4effb" stroke="#7299c2"/><text class="kind" x="997.5" y="526">Python</text><text class="title" x="997.5" y="551">메뉴 필터링</text><text class="preview" x="997.5" y="573">알레르기 제외 → 선호</text><text class="sub">입력: 고객이 확인한 조건 + data/menu.json의 메뉴 정보</text><text class="sub">처리: 알레르기 재료가 있는 메뉴를 먼저 제외하고, 남은 메뉴에 선호 조건을 적용합니다.</text><text class="sub">결과: 조건에 맞는 메뉴 후보 목록</text><text class="sub">참고: 알레르기가 있을 때 재료 또는 알레르기 정보가 없는 메뉴는 후보에서 제외합니다.</text><text class="sub">함수 · 현재 서버: filter_recommendation_menu()</text></g>
