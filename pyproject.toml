[project]
name = "wanted-cafe-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "jupyter>=1.1.1",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
embedding = [
    "faiss-cpu>=1.15.1",
    "pillow>=13.0.0",
    "sentence-transformers[image]>=6.1.0",
    "transformers>=5.21.0",
]
ocr = [
    "google-cloud-vision>=3.16.0",
    "pillow>=13.0.0",
]


[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
